<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Eventos e Animações com jQuery</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1>Eventos e Animações com jQuery</h1>

    <p>Explore os eventos e animações abaixo</p>

    <button id="btnMensagem">Mostrar mensagem</button>

    <div id="mensagem">
        Olá! Esta mensagem foi exibida usando jQuery.
    </div>

    <button id="btnMenu">Mostrar/Ocultar conteúdo</button>

    <div id="conteudo">
        <h2>Conteúdo interativo</h2>
        <p>Este conteúdo poderá aparecer e desaparecer através de uma animação.</p>
    </div>

    <button id="btnEsconder">Esconder mensagem</button>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

    <!-- Nosso JavaScript -->
    <script src="/script.js"></script>

</body>

</html>
